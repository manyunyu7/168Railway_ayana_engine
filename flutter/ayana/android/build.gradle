// The plugin is a thin Kotlin shell (a TextureRegistry entry -> Surface -> JNI) around libayana.so,
// which the engine's own CMakeLists.txt builds from ../../.. — see flutter/ayana/android/CMakeLists.txt.
group 'com.ayana.engine'
version '0.1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
    }
}

rootProject.allprojects { repositories { google(); mavenCentral() } }

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.ayana.engine'
    compileSdk 36
    ndkVersion '28.2.13676358'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
    defaultConfig {
        minSdk 24
        // arm64 only for now: the engine is built and proven for arm64-v8a (docs/FLUTTER.md M1).
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
}
